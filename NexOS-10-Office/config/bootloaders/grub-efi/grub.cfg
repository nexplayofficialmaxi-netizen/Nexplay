# GRUB menu for the live ISO's EFI boot path. live-build supplies the live kernel/initrd.
set default=0
set timeout=8
set timeout_style=menu

if loadfont /boot/grub/font.pf2; then
  set gfxmode=auto
  set gfxpayload=keep
  terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-blue

menuentry 'NexOS 10 Office — Iniciar sesión Live' --id nexos-live {
  linux /live/vmlinuz boot=live components quiet
  initrd /live/initrd.img
}

menuentry 'NexOS 10 Office — Modo detallado' --id nexos-live-verbose {
  linux /live/vmlinuz boot=live components
  initrd /live/initrd.img
}
